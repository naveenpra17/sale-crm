services:
  - type: web
    name: 50-acre-sales-challenge-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "None"
      - key: APP_TIMEZONE
        value: "Asia/Kolkata"
      - key: ACCESS_TOKEN_EXPIRATION
        value: "15"
      - key: REFRESH_TOKEN_EXPIRATION
        value: "30"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: SPRING_PROFILES_ACTIVE
        value: "prod"
